<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>服务器监控</title>
<style>
  :root{
    --bg:#0a0e16; --card:#121a2b; --card-hi:#16203a; --line:#1f2a44; --line-soft:#182238;
    --text:#e8edf8; --muted:#8a95ac; --dim:#5e6a83;
    --ok:#34d399; --warn:#fbbf24; --crit:#f87171; --down:#64748b;
    --c-cpu:#60a5fa; --c-mem:#a78bfa; --c-disk:#2dd4bf; --c-npu:#34d399; --c-hbm:#f472b6;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#24304d;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
  ::selection{background:rgba(96,165,250,.35)}
  body{margin:0;color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       background:radial-gradient(1100px 480px at 85% -10%,rgba(96,165,250,.08),transparent 60%),
                  radial-gradient(900px 420px at -10% 0%,rgba(52,211,153,.05),transparent 55%),
                  var(--bg);min-height:100vh}

  /* ── 顶栏 ─────────────────────────────── */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         padding:13px 24px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(10,14,22,.85);backdrop-filter:blur(10px);z-index:5}
  .brand{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:10px;letter-spacing:.5px}
  .brand svg{color:var(--c-cpu)}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;
         box-shadow:0 0 0 0 rgba(61,220,151,.55);animation:p 2.4s infinite}
  .pulse.warn{background:var(--warn);box-shadow:0 0 0 0 rgba(251,191,36,.55)}
  .pulse.crit{background:var(--crit);box-shadow:0 0 0 0 rgba(248,113,113,.55)}
  .pulse.down{background:var(--down);animation:none;box-shadow:none}
  @keyframes p{70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  .summary{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);
        color:var(--muted);display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.02)}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--down)}
  .chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)}
  .chip.crit i{background:var(--crit)} .chip.down i{background:var(--down)}
  .chip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .meta{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px;
        font-variant-numeric:tabular-nums}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;
         padding:3px 12px;border-radius:99px;cursor:pointer;transition:.2s}
  .ghost:hover{color:var(--text);border-color:#33436b}

  /* ── 主体 ─────────────────────────────── */
  main{max-width:1500px;margin:0 auto;padding:22px 24px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;align-items:start}
  .empty{color:var(--muted);padding:48px;text-align:center;grid-column:1/-1}

  .card{background:linear-gradient(180deg,#141c30,#101726);border:1px solid var(--line);
        border-top:3px solid var(--down);border-radius:16px;padding:16px 19px 14px;
        transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.38);border-color:#2a3a61}
  .card.ok{border-top-color:var(--ok)} .card.warn{border-top-color:var(--warn)}
  .card.crit{border-top-color:var(--crit)} .card.down{border-top-color:var(--down)}

  .chead{display:flex;align-items:center;justify-content:space-between}
  .ct{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--down);flex:none}
  .ok .dot{background:var(--ok);box-shadow:0 0 9px var(--ok)}
  .warn .dot{background:var(--warn);box-shadow:0 0 9px rgba(251,191,36,.7)}
  .crit .dot{background:var(--crit);box-shadow:0 0 9px var(--crit)}
  .badge{font-size:12px;padding:2.5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
  .badge.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
  .badge.crit{color:var(--crit);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
  .chost{color:var(--dim);font-size:11.5px;margin:3px 0 4px;font-family:Consolas,monospace}

  /* ── 指标区块 ──────────────────────────── */
  .metric{margin-top:13px}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .mlabel{color:var(--muted);font-size:12px;letter-spacing:1.2px;font-weight:600}
  .mval{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .mval-s{font-size:12px;font-weight:500;color:var(--muted)}
  .mval.warn-t{color:var(--warn)} .mval.crit-t{color:var(--crit)}
  .warn-t{color:var(--warn)} .crit-t{color:var(--crit)}
  .msub{color:var(--dim);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
  .dim{color:var(--dim);font-weight:400}
  .dim-s{color:var(--dim);font-size:12px}
  .bar{height:7px;background:#1a2338;border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,.61,.36,1)}
  .f-cpu{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
  .f-mem{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
  .f-disk{background:linear-gradient(90deg,#14b8a6,#2dd4bf)}
  .f-npu{background:linear-gradient(90deg,#10b981,#34d399)}
  .f-hbm{background:linear-gradient(90deg,#ec4899,#f472b6)}
  .f-warn{background:linear-gradient(90deg,#d97706,#fbbf24)}
  .f-crit{background:linear-gradient(90deg,#dc2626,#f87171)}
  .spark{width:100%;height:34px;margin-top:7px;opacity:.9;display:block}

  /* ── 加速卡(NPU/GPU) ───────────────────── */
  .accel{border:1px solid var(--line);border-radius:11px;padding:10px 13px 9px;margin-top:9px;
         background:linear-gradient(180deg,rgba(30,42,68,.42),rgba(24,34,56,.28))}
  .arow1{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:7px;gap:8px}
  .aname{font-weight:600;display:inline-flex;align-items:center;gap:8px;min-width:0}
  .chipid{font-family:Consolas,monospace;font-size:11px;font-weight:600;color:var(--c-npu);
          background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);
          border-radius:6px;padding:0 6px;line-height:17px;flex:none}
  .ameta{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .abad{color:var(--crit);font-weight:600}
  .agroup{display:grid;grid-template-columns:34px 1fr 104px;gap:9px;align-items:center;margin-top:6px;font-size:11px}
  .agl{color:var(--dim);cursor:help}
  .agv{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .aproc{color:var(--dim);font-size:11px;margin-top:7px;font-family:Consolas,monospace;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aproc::before{content:"⚡ ";opacity:.7}

  /* ── 磁盘 / 底栏 ───────────────────────── */
  .disk{display:grid;grid-template-columns:96px 1fr 178px;gap:10px;align-items:center;margin-top:8px;font-size:12px}
  .dmount{color:var(--muted);font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dnum{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .dnum b{font-weight:600}
  .foot{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:12px;
        margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
  .fl{color:var(--dim);margin-right:5px}

  /* ── 离线 ─────────────────────────────── */
  .offline{padding:30px 8px 24px;text-align:center;color:var(--muted)}
  .off-icon{font-size:30px;margin-bottom:8px;filter:grayscale(.3)}
  .off-t{font-size:13.5px;font-weight:600;color:#d3a15f}
  .off-err{font-size:11.5px;color:#b08a5e;margin:8px auto 0;max-width:92%;font-family:Consolas,monospace;
           word-break:break-all;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.15);
           border-radius:8px;padding:7px 10px}

  /* ── 告警 ─────────────────────────────── */
  .alerts{max-width:1500px;margin:10px auto 0;padding:0 24px}
  .alerts h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 9px;letter-spacing:1px;
             display:flex;align-items:center;gap:8px}
  .alerts h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .alerts ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:13px;
             background:var(--card);overflow:hidden}
  .alerts li{display:flex;align-items:center;gap:11px;padding:9px 15px;font-size:12.5px;
             border-top:1px solid var(--line-soft)}
  .alerts li:first-child{border-top:0}
  .adot{width:7px;height:7px;border-radius:50%;flex:none}
  li.ok .adot{background:var(--ok)} li.warn .adot{background:var(--warn)}
  li.crit .adot{background:var(--crit)} li.down .adot{background:var(--down)}
  .atime{color:var(--dim);font-family:Consolas,monospace;font-size:11.5px;flex:none}
  .alerts b{font-weight:600}
  .amsg{color:var(--muted)}
  .alerts .empty{padding:15px}
  footer{color:var(--dim);font-size:11.5px;text-align:center;padding:14px 0 24px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="pulse" id="pulse"></span>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r="1.1" fill="currentColor" stroke="none"/></svg>
    服务器监控</div>
  <div class="summary" id="summary"></div>
  <div class="meta"><span id="meta">连接中…</span>
    <button class="ghost" id="btn-pause">暂停</button></div>
</header>
<main>
  <div class="grid" id="grid"><div class="empty">正在加载…</div></div>
  <section class="alerts">
    <h2>最近告警</h2>
    <ul id="alerts"><li class="empty">暂无告警</li></ul>
  </section>
</main>
<footer>服务端定时经 SSH 采集实时指标 · 面板每 5 秒自动刷新 · 阈值与服务器列表见 config.yaml</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtGB = v => v == null ? "—" : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + " GB";
const fmtRate = k => k == null ? "—" : (k >= 1024 ? (k/1024).toFixed(2)+" MB/s" : k.toFixed(0)+" KB/s");
const levelText = s => ({ok:"正常",warn:"警告",crit:"严重",down:"离线"})[s] || s;
const timeStr = t => new Date(t).toLocaleTimeString("zh-CN",{hour12:false});
let uid = 0;

function bar(pct, cls, warn, crit){
  pct = Math.max(0, Math.min(100, pct ?? 0));
  let c = cls;
  if (warn != null && pct != null){
    if (pct >= crit) c = "f-crit"; else if (pct >= warn) c = "f-warn";
  }
  return `<div class="bar"><div class="fill ${c}" style="width:${pct.toFixed(1)}%"></div></div>`;
}
function tint(v, warn=80, crit=95){
  return v == null ? "" : v >= crit ? "crit-t" : v >= warn ? "warn-t" : "";
}
function spark(points, color){
  if (points.filter(v => v != null).length < 2)
    return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>`;
  const step = 100 / (points.length - 1);
  const poly = points.map((v,i) => v == null ? null :
    `${(i*step).toFixed(1)},${(28 - Math.max(0,Math.min(100,v))/100*26).toFixed(1)}`)
    .filter(Boolean).join(" ");
  const gid = "sg" + (++uid);
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".3"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#${gid})" points="${poly} 100,30 0,30"/>
    <polyline fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" points="${poly}"/>
  </svg>`;
}

function accelBlock(a){
  if (!a || !a.items || !a.items.length) return "";
  const isNpu = a.type === "NPU";
  const utils = a.items.map(x => x.util).filter(v => v != null);
  const avg = utils.length ? Math.round(utils.reduce((s,v)=>s+v,0) / utils.length) : null;
  const totU = a.items.reduce((s,x) => s + (x.mem_used_gb || 0), 0);
  const totT = a.items.reduce((s,x) => s + (x.mem_total_gb || 0), 0);
  const unit = isNpu ? "芯片" : "卡";
  const head =
    `<div class="mrow"><span class="mlabel">${isNpu ? "NPU 昇腾" : "GPU"}<span class="dim"> · ${a.items.length} ${unit}</span></span>
     <span class="mval mval-s">${avg != null ? `均 ${avg}%` : ""}${totT ? `${avg != null ? " · " : ""}${totU.toFixed(0)}/${totT.toFixed(0)} GB` : ""}</span></div>`;
  const chips = a.items.map(it => {
    const memPct = it.mem_total_gb ? it.mem_used_gb / it.mem_total_gb * 100 : 0;
    const tcls = it.temp_c == null ? "" : it.temp_c >= 85 ? "crit-t" : it.temp_c >= 75 ? "warn-t" : "";
    const meta = [
      it.health && it.health !== "OK" ? `<span class="abad">${esc(it.health)}</span>` : null,
      it.temp_c != null ? `<span class="${tcls}">${it.temp_c}°C</span>` : null,
      it.power_w != null ? it.power_w + "W" : null
    ].filter(Boolean).join('<span class="dim"> · </span>');
    return `<div class="accel">
      <div class="arow1">
        <span class="aname"><span class="chipid">#${esc(it.id)}</span>${esc(it.name || "")}</span>
        <span class="ameta">${meta}</span>
      </div>
      <div class="agroup"><span class="agl" title="AI 计算核心占用率 (AICore%): 越高说明卡越忙, 0% 为空闲">算力</span>
        ${bar(it.util, isNpu ? "f-npu" : "f-cpu")}<span class="agv">${it.util == null ? "—" : Math.round(it.util) + "%"}</span></div>
      <div class="agroup"><span class="agl" title="HBM 高带宽显存用量">显存</span>
        ${bar(memPct, "f-hbm")}<span class="agv">${fmtGB(it.mem_used_gb)} / ${fmtGB(it.mem_total_gb)}</span></div>
      ${it.proc ? `<div class="aproc" title="${esc(it.proc)}">${esc(it.proc)}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="metric">${head}${chips}</div>`;
}

function fmtUptime(d){
  if (d == null) return "—";
  if (d >= 1) return `${Math.floor(d)} 天 ${Math.round((d % 1) * 24)} 小时`;
  return `${Math.round(d * 24)} 小时`;
}

function offlineBody(s){
  return `<div class="offline"><div class="off-icon">⚠️</div>
    <div class="off-t">SSH 连接失败</div>
    <div class="off-err">${esc(s.error || "未知错误")}</div></div>`;
}

function card(s){
  const st = s.status || "down";
  const mem = s.mem || {};
  const body = !s.online ? offlineBody(s) : `
    <div class="metric">
      <div class="mrow"><span class="mlabel">CPU</span>
        <span class="mval ${tint(s.cpu_percent)}">${s.cpu_percent == null ? "采样中…" : s.cpu_percent.toFixed(1) + "%"}</span></div>
      ${bar(s.cpu_percent, "f-cpu", 80, 95)}
      ${spark((s.history || []).map(h => h.cpu), "#60a5fa")}
    </div>
    <div class="metric">
      <div class="mrow"><span class="mlabel">内存</span>
        <span class="mval ${tint(mem.percent, 85, 95)}">${mem.percent == null ? "—" : mem.percent.toFixed(1) + "%"}</span></div>
      ${bar(mem.percent, "f-mem", 85, 95)}
      <div class="msub">${fmtGB(mem.used_gb)} / ${fmtGB(mem.total_gb)}</div>
    </div>
    ${accelBlock(s.accel) ||
      `<div class="mrow" style="margin-top:13px"><span class="mlabel">加速卡</span><span class="dim-s">未检测到 NPU / GPU</span></div>`}
    ${(s.disks || []).length ? `<div class="metric">
      <div class="mrow"><span class="mlabel">磁盘</span>
        <span class="mval mval-s">${s.disks.length} 个挂载${s.disks_hidden ? ` · 另 ${s.disks_hidden} 个未显示` : ""}</span></div>
      ${s.disks.map(d => `<div class="disk">
        <span class="dmount" title="${esc(d.mount)}">${esc(d.mount)}</span>
        ${bar(d.percent, "f-disk", 80, 90)}
        <span class="dnum"><b class="${tint(d.percent, 80, 90)}">${Math.round(d.percent)}%</b> · ${d.used_gb}/${d.total_gb} GB</span>
      </div>`).join("")}
    </div>` : ""}
    <div class="foot">
      <span><span class="fl">负载</span>${(s.load || []).map(v => v == null ? "—" : v.toFixed(2)).join(" / ")}${s.cores ? `<span class="dim"> (${s.cores}核)</span>` : ""}</span>
      <span><span class="fl">运行</span>${fmtUptime(s.uptime_days)}</span>
      <span><span class="fl">网络</span>↓ ${fmtRate(s.net_rx_kbps)} · ↑ ${fmtRate(s.net_tx_kbps)}</span>
    </div>`;
  return `<div class="card ${esc(st)}">
    <div class="chead">
      <div class="ct"><span class="dot"></span><span>${esc(s.name)}</span></div>
      <span class="badge ${esc(st)}">${levelText(st)}</span>
    </div>
    <div class="chost">${esc(s.label || "")}</div>
    ${body}
  </div>`;
}

function render(d){
  const sv = d.servers || [];
  document.getElementById("grid").innerHTML =
    sv.map(card).join("") || `<div class="empty">config.yaml 中没有启用的服务器</div>`;
  const c = d.counts || {};
  document.getElementById("summary").innerHTML =
    ["ok","warn","crit","down"].map(k =>
      `<span class="chip ${k}"><i></i>${levelText(k)} <b>${c[k] || 0}</b></span>`).join("");
  const worst = (c.crit && "crit") || (c.warn && "warn") || (c.down && "down") || "ok";
  document.getElementById("pulse").className = "pulse " + (worst === "ok" ? "" : worst);
  document.title = ((c.warn || c.crit) ? `(${c.warn + c.crit} 项告警) ` : "") + "服务器监控";
  const al = d.alerts || [];
  document.getElementById("alerts").innerHTML = al.length ? al.map(a =>
    `<li class="${esc(a.level)}"><span class="adot"></span>
     <span class="atime">${timeStr(a.t * 1000)}</span><b>${esc(a.name)}</b>
     <span class="amsg">${esc(a.msg)}</span></li>`).join("")
    : `<li class="empty">暂无告警</li>`;
  lastOk = true;
}

/* ── 自动刷新(5s) + 倒计时 + 暂停 ─────────────── */
const REFRESH = 5;
let remain = REFRESH, paused = false, lastOk = false, busy = false, lastTime = null;
const metaEl = document.getElementById("meta");

function updateMeta(){
  if (paused){ metaEl.textContent = "已暂停自动刷新" + (lastTime ? ` · 更新于 ${timeStr(lastTime)}` : ""); return; }
  metaEl.textContent = (lastTime ? `更新于 ${timeStr(lastTime)} · ` : "") + `${remain}s 后刷新`;
}

async function refresh(){
  if (busy) return;
  busy = true;
  try{
    const r = await fetch("/api/status", {cache: "no-store"});
    render(await r.json());
    lastTime = Date.now();
  }catch(e){
    metaEl.textContent = "无法连接后端(python app.py 未运行?)";
    lastOk = false;
  }
  remain = REFRESH;
  updateMeta();
  busy = false;
}

const btn = document.getElementById("btn-pause");
btn.onclick = () => {
  paused = !paused;
  btn.textContent = paused ? "继续" : "暂停";
  if (!paused) remain = REFRESH;
  updateMeta();
};

setInterval(() => {
  if (paused) return;
  remain--;
  if (remain <= 0) refresh(); else updateMeta();
}, 1000);

refresh();
</script>
</body>
</html>
