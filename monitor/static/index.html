<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./static/manifest.webmanifest">
<link rel="icon" href="./static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./static/icons/icon-192.png">
<title>服务器全景监控大屏</title>
<style>
  :root {
    --bg: #090d16;
    --card: rgba(16, 24, 40, 0.85);
    --card-hover: rgba(22, 32, 54, 0.95);
    --line: rgba(70, 92, 130, 0.22);
    --line-hi: rgba(90, 120, 170, 0.35);
    --text: #f8fafc;
    --muted: #94a3b8;
    --dim: #64748b;
    --ok: #10b981;
    --warn: #f59e0b;
    --crit: #ef4444;
    --down: #64748b;
    --c-cpu: #38bdf8;
    --c-mem: #a855f7;
    --c-disk: #14b8a6;
    --c-npu: #10b981;
    --c-hbm: #ec4899;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #263554; border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }

  body {
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 85% -10%, rgba(56, 189, 248, 0.08), transparent 60%),
                radial-gradient(1000px 500px at 0% 0%, rgba(16, 185, 129, 0.06), transparent 55%),
                var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 紧凑顶栏 ─────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(9, 13, 22, 0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    white-space: nowrap;
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2.4s infinite;
  }
  .pulse.warn { background: var(--warn); }
  .pulse.crit { background: var(--crit); }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 6px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  .summary-chips { display: flex; gap: 6px; align-items: center; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line);
    color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.03);
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--down); }
  .chip.ok i { background: var(--ok); }
  .chip.warn i { background: var(--warn); }
  .chip.crit i { background: var(--crit); }
  .chip b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

  .meta {
    margin-left: auto; color: var(--muted); font-size: 11.5px;
    display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums;
  }
  .ghost {
    background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--muted);
    font-size: 11.5px; padding: 3px 10px; border-radius: 99px; cursor: pointer; transition: 0.2s;
  }
  .ghost:hover { color: var(--text); border-color: var(--c-cpu); }

  /* ── 通道通栏条 (全并排紧凑药丸) ─────────── */
  .tunnels-bar {
    padding: 8px 20px;
    background: rgba(14, 20, 34, 0.75);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .tunnels-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 0.5px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tunnel-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 3px 10px;
    font-size: 11.5px;
    color: #e2e8f0;
    text-decoration: none;
  }
  .tunnel-pill .tdot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none;
    box-shadow: 0 0 6px var(--ok);
  }
  .tunnel-pill.crit .tdot, .tunnel-pill.down .tdot {
    background: var(--crit); box-shadow: 0 0 6px var(--crit);
  }
  .tunnel-pill .tmsg {
    color: var(--dim); font-size: 10.5px; margin-left: 2px;
  }

  /* ── 主监控工作区 (全览紧凑网格) ─────────── */
  main {
    flex: 1;
    padding: 16px 20px;
    max-width: 1720px;
    margin: 0 auto;
    width: 100%;
  }

  .compact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 14px;
    align-items: stretch;
  }
  @media (min-width: 1180px) {
    .compact-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* ── 云服务器合并单元样式 ───────────────────── */
  .cloud-cluster-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
    justify-content: space-around;
  }
  .sub-cloud-unit {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sub-cloud-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .cloud-divider {
    height: 1px;
    background: var(--line);
    margin: 3px 0;
  }

  /* 服务器卡片 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(8px);
    transition: 0.2s;
  }
  .card:hover {
    border-color: var(--line-hi);
    background: var(--card-hover);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  /* 左侧状态色指示条 */
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
    background: var(--ok);
  }
  .card.warn::before { background: var(--warn); }
  .card.crit::before { background: var(--crit); }
  .card.down::before { background: var(--down); }

  /* 头部 */
  .chead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .c-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .c-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .warn .c-dot { background: var(--warn); }
  .crit .c-dot { background: var(--crit); }

  .c-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .c-group {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--dim);
    flex: none;
  }
  .c-host {
    color: var(--dim);
    font-size: 11px;
    font-family: Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: -6px;
    margin-bottom: -2px;
  }

  /* CPU & 内存并排指标条 */
  .metrics-compact {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.02);
  }
  .mbox { display: flex; flex-direction: column; gap: 3px; }
  .mhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; }
  .mhead .label { color: var(--muted); font-weight: 600; }
  .mhead .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .f-cpu { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  .f-mem { background: linear-gradient(90deg, #7c3aed, #c084fc); }
  .f-npu { background: linear-gradient(90deg, #059669, #34d399); }
  .f-hbm { background: linear-gradient(90deg, #db2777, #f472b6); }
  .f-warn { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .f-crit { background: linear-gradient(90deg, #dc2626, #f87171); }
  .msub { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
  .warn-t { color: var(--warn); }
  .crit-t { color: var(--crit); }

  /* 加速芯片紧凑网格 (NPU/GPU) */
  .accel-box {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .accel-title-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .chips-dense-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 5px;
  }
  .chips-mini-strip { display: none; }
  .chip-mini-pill {
    font-size: 9.5px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
    border-radius: 3px;
    padding: 0 4px;
    font-family: Consolas, monospace;
    color: #a7f3d0;
    white-space: nowrap;
  }
  .chip-mini-pill b { color: #34d399; font-weight: 600; margin-left: 2px; }
  .chip-item {
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
  }
  .chip-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chip-tag {
    font-family: Consolas, monospace;
    font-weight: 700;
    color: var(--c-npu);
    background: rgba(16, 185, 129, 0.15);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 14px;
  }
  .chip-temp { color: var(--dim); font-variant-numeric: tabular-nums; }
  .chip-line {
    display: grid;
    grid-template-columns: 22px 1fr 34px;
    align-items: center;
    gap: 4px;
  }
  .chip-line .lbl { color: var(--dim); }
  .chip-line .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 活跃进程 (单行胶囊) */
  .proc-row {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    font-size: 11px;
    white-space: nowrap;
  }
  .proc-row .icon { color: var(--warn); font-size: 10px; flex: none; }
  .proc-pill {
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 4px;
    padding: 1px 6px;
    color: #bae6fd;
    font-family: Consolas, monospace;
    font-size: 10.5px;
  }
  .proc-pill b { color: #38bdf8; font-weight: 600; margin-left: 3px; }

  /* 底部一行指标流 */
  .card-foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--dim);
    font-size: 10.5px;
    padding-top: 6px;
    border-top: 1px dashed rgba(255, 255, 255, 0.05);
    font-variant-numeric: tabular-nums;
  }
  .card-foot span { white-space: nowrap; }
  .m-proc-inline { display: none; }

  /* ── 底部版权与下载 ─────────────────────────── */
  footer {
    color: var(--dim);
    font-size: 11px;
    text-align: center;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: rgba(9, 13, 22, 0.5);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .dl-links { display: flex; gap: 8px; }
  .dl-links a {
    text-decoration: none; font-size: 11px; border-radius: 99px; padding: 3px 12px;
    border: 1px solid var(--line); color: var(--muted); transition: 0.2s;
  }
  .dl-links a:hover { color: #fff; border-color: var(--c-cpu); }

  /* ── 移动端适配 (超紧凑一页全览，不折叠，全部直接显示) ── */
  @media (max-width: 768px) {
    header { padding: 4px 8px; gap: 5px; }
    .brand { font-size: 12px; gap: 4px; }
    .brand svg { width: 13px; height: 13px; }
    .meta { font-size: 9px; gap: 4px; }
    .ghost { padding: 1px 5px; font-size: 8.5px; }
    .summary-chips { gap: 3px; }
    .chip { font-size: 8.5px; padding: 0 4px; gap: 2px; }
    .chip i { width: 4px; height: 4px; }

    /* 通道栏: 紧凑细条 */
    .tunnels-bar { padding: 2px 6px; gap: 4px; }
    .tunnels-title { font-size: 8.5px; }
    .tunnel-pill { padding: 0 4px; font-size: 8.5px; gap: 2px; line-height: 14px; }
    .tunnel-pill .tdot { width: 4px; height: 4px; }
    .tunnel-pill .tmsg { display: none; }

    /* 主网格: 极简间距，完美一屏全览 */
    main { padding: 3px 6px; }
    .compact-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* 卡片主体: 每一台都直接展开、超薄紧凑 */
    .card {
      padding: 4px 7px 3px;
      border-radius: 6px;
      gap: 2px;
      box-shadow: none;
    }
    .card::before { width: 2.5px; }

    /* 头部 */
    .chead { gap: 4px; }
    .c-name { font-size: 12px; }
    .c-group { font-size: 9px; padding: 0 4px; }
    .c-host { display: none; } /* 移动端省略详细 host 节约高度 */
    .badge { font-size: 8px; padding: 0 3px; line-height: 11px; }

    /* CPU & 内存并排指标条: 超紧凑 */
    .metrics-compact {
      padding: 1.5px 4px;
      gap: 5px;
      border-radius: 3px;
    }
    .mhead { font-size: 8.5px; }
    .mhead .val { font-size: 8.5px; }
    .bar { height: 2px; }
    .msub { display: none; } /* 移动端省略详细GB文字，防止被卡片右侧裁切 */

    /* 加速卡: 隐藏多行大网格, 展示单行紧凑芯片流 */
    .accel-box { gap: 1px; }
    .accel-title-row { font-size: 8px; }
    .chips-dense-grid { display: none !important; }
    .chips-mini-strip {
      display: flex !important;
      flex-wrap: wrap;
      gap: 1px 2.5px;
      align-items: center;
    }
    .chip-mini-pill {
      font-size: 7.5px;
      padding: 0 2px;
      border-radius: 2px;
      line-height: 10px;
    }

    /* 手机端隐藏多行 proc pills，并在 card-foot 内单行内联展示 */
    .proc-row { display: none !important; }
    .m-proc-inline { display: inline !important; }
    .m-proc-inline b { color: var(--c-cpu); font-weight: 600; margin-left: 2px; }

    /* 底部指标行 */
    .card-foot {
      padding-top: 1px;
      margin-top: 0px;
      font-size: 8px;
      gap: 3px;
      line-height: 11px;
    }

    /* 云服务器集群合并卡片内部紧凑 */
    .cloud-cluster-body { gap: 1.5px; }
    .sub-cloud-unit { gap: 0.5px; }
    .sub-cloud-head .c-name { font-size: 10px; }
    .cloud-divider { margin: 1px 0; }

    footer { padding: 3px 6px 5px; gap: 2px; }
    #alert-summary { font-size: 8px; }
    .dl-links a { font-size: 7.5px; padding: 1px 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="pulse" id="pulse"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r="1.1" fill="currentColor" stroke="none"/></svg>
    监控全景大屏
  </div>
  <div class="summary-chips" id="summary"></div>
  <div class="meta">
    <span id="meta">正在拉取监控状态…</span>
    <button class="ghost" id="btn-pause">暂停</button>
  </div>
</header>

<!-- 顶层通栏：通道网络状态药丸行 -->
<div class="tunnels-bar" id="tunnels-bar" style="display:none">
  <div class="tunnels-title">🌐 网络通道:</div>
  <div id="tunnels-list" style="display:flex;gap:8px;align-items:center;"></div>
</div>

<main>
  <div class="compact-grid" id="grid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dim)">正在加载实时数据…</div>
  </div>
</main>

<footer>
  <div id="alert-summary">暂无告警</div>
  <div class="dl-links">
    <a href="./static/ServerMonitor.apk" download>📱 Android APK</a>
    <a href="./download/ServerMonitor.exe?token=srvmon-9f3Kq7Wm2Rx8Vb4N" download>💻 Windows EXE</a>
  </div>
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtGB = v => v == null ? "—" : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + "G";
const fmtRate = k => k == null ? "—" : (k >= 1024 ? (k/1024).toFixed(1)+"M/s" : Math.round(k)+"K/s");
const levelText = s => ({ok:"正常", warn:"警告", crit:"严重", down:"离线"})[s] || s;
const timeStr = t => new Date(t).toLocaleTimeString("zh-CN",{hour12:false});

function bar(pct, cls, warn, crit){
  pct = Math.max(0, Math.min(100, pct ?? 0));
  let c = cls;
  if (warn != null && pct != null){
    if (pct >= crit) c = "f-crit"; else if (pct >= warn) c = "f-warn";
  }
  return `<div class="bar"><div class="fill ${c}" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function tint(v, warn=80, crit=95){
  return v == null ? "" : v >= crit ? "crit-t" : v >= warn ? "warn-t" : "";
}

function fmtUptime(d){
  if (d == null) return "—";
  if (d >= 1) return `${Math.floor(d)}天`;
  return `${Math.round(d * 24)}时`;
}

/* 渲染单台在线服务器卡片 (紧凑型，高度收敛在 200~280px) */
function renderCard(s){
  const st = s.status || "ok";
  const mem = s.mem || {};
  const chips = (s.accel && s.accel.items) || [];
  const isNpu = s.accel && s.accel.type === "NPU";

  // 加速芯片区 (若有卡)
  let accelHtml = "";
  if (chips.length > 0){
    const utils = chips.map(x => x.util).filter(v => v != null);
    const avg = utils.length ? Math.round(utils.reduce((a,b)=>a+b,0) / utils.length) : null;
    const totU = chips.reduce((a,x) => a + (x.mem_used_gb || 0), 0);
    const totT = chips.reduce((a,x) => a + (x.mem_total_gb || 0), 0);

    const itemsHtml = chips.map(it => {
      const memPct = it.mem_total_gb ? (it.mem_used_gb / it.mem_total_gb * 100) : 0;
      return `<div class="chip-item">
        <div class="chip-top">
          <span class="chip-tag">#${esc(it.id)}</span>
          <span class="chip-temp">${it.temp_c != null ? it.temp_c + "°C" : ""}${it.proc ? " · " + esc(it.proc).slice(0,10) : ""}</span>
        </div>
        <div class="chip-line">
          <span class="lbl">算力</span>
          ${bar(it.util, isNpu ? "f-npu" : "f-cpu")}
          <span class="val">${it.util == null ? "—" : Math.round(it.util) + "%"}</span>
        </div>
        <div class="chip-line">
          <span class="lbl">显存</span>
          ${bar(memPct, "f-hbm")}
          <span class="val">${fmtGB(it.mem_used_gb)}</span>
        </div>
      </div>`;
    }).join("");

    // 手机端极简芯片条 (只占一行, 不占大量高度)
    const miniChips = chips.map(it =>
      `<span class="chip-mini-pill">#${esc(it.id)}<b>${it.util == null ? "—" : Math.round(it.util) + "%"}</b></span>`
    ).join("");

    accelHtml = `<div class="accel-box">
      <div class="accel-title-row">
        <span>⚡ ${isNpu ? "NPU 昇腾" : "GPU"} (${chips.length}卡)</span>
        <span>${avg != null ? `均 ${avg}%` : ""}${totT ? ` · 显存 ${totU.toFixed(0)}/${totT.toFixed(0)}G` : ""}</span>
      </div>
      <div class="chips-dense-grid">${itemsHtml}</div>
      <div class="chips-mini-strip">${miniChips}</div>
    </div>`;
  }

  // 活跃进程 (单行药丸)
  let procHtml = "";
  const procs = s.processes || [];
  if (procs.length > 0){
    const pills = procs.slice(0, 3).map(p =>
      `<span class="proc-pill">${esc(p.name || "?")}<b>${Math.round(p.cpu_percent || 0)}%</b></span>`
    ).join("");
    procHtml = `<div class="proc-row"><span class="icon">⚡</span>${pills}</div>`;
  }

  // 磁盘最满的一项
  const disks = s.disks || [];
  let diskStr = "";
  if (disks.length > 0){
    const worst = disks.reduce((a,b) => (a.percent > b.percent ? a : b), disks[0]);
    diskStr = `盘 ${Math.round(worst.percent)}%`;
  }

  const loadStr = (s.load && s.load.length) ? `负载 ${s.load[0].toFixed(1)}` : "";
  const netStr = s.net_rx_kbps != null ? `↓${fmtRate(s.net_rx_kbps)}` : "";
  const upStr = s.uptime_days != null ? `行 ${fmtUptime(s.uptime_days)}` : "";

  const topProcStr = procs.length ? `<span class="m-proc-inline">⚡ ${esc(procs[0].name)}${procs[0].cpu_percent ? ` <b>${Math.round(procs[0].cpu_percent)}%</b>` : ""}</span>` : "";

  return `<div class="card ${esc(st)}">
    <div class="chead">
      <div class="c-left">
        <span class="c-dot"></span>
        <span class="c-name">${esc(s.name)}</span>
        <span class="c-group">${esc(s.group || "主机")}</span>
      </div>
      <span class="badge ${esc(st)}">${levelText(st)}</span>
    </div>
    <div class="c-host">${esc(s.label || "")}</div>

    <!-- CPU + 内存并排指标 -->
    <div class="metrics-compact">
      <div class="mbox">
        <div class="mhead">
          <span class="label">CPU</span>
          <span class="val ${tint(s.cpu_percent)}">${s.cpu_percent == null ? "—" : s.cpu_percent.toFixed(1) + "%"}</span>
        </div>
        ${bar(s.cpu_percent, "f-cpu", 80, 95)}
      </div>
      <div class="mbox">
        <div class="mhead">
          <span class="label">内存</span>
          <span class="val ${tint(mem.percent, 85, 95)}">${mem.percent == null ? "—" : mem.percent.toFixed(1) + "%"} <span class="msub">${fmtGB(mem.used_gb)}/${fmtGB(mem.total_gb)}</span></span>
        </div>
        ${bar(mem.percent, "f-mem", 85, 95)}
      </div>
    </div>

    <!-- 加速卡 -->
    ${accelHtml}

    <!-- 进程 -->
    ${procHtml}

    <!-- 底部极简状态行 -->
    <div class="card-foot">
      <span>${[topProcStr, diskStr, loadStr].filter(Boolean).join(" · ")}</span>
      <span>${[netStr, upStr].filter(Boolean).join(" · ")}</span>
    </div>
  </div>`;
}

/* ── 合并轻量云服务器卡片 (azure-lin & myserver 组合并) ── */
function renderMergedCloudCard(servers){
  if (!servers || !servers.length) return "";
  const isAnyWarn = servers.some(s => s.status === "warn");
  const isAnyCrit = servers.some(s => s.status === "crit");
  const st = isAnyCrit ? "crit" : (isAnyWarn ? "warn" : "ok");

  const subItems = servers.map(s => {
    const mem = s.mem || {};
    const s_st = s.status || "ok";

    let procHtml = "";
    const procs = s.processes || [];
    if (procs.length > 0){
      const pills = procs.slice(0, 3).map(p =>
        `<span class="proc-pill">${esc(p.name || "?")}<b>${Math.round(p.cpu_percent || 0)}%</b></span>`
      ).join("");
      procHtml = `<div class="proc-row" style="margin-top:2px;"><span class="icon">⚡</span>${pills}</div>`;
    }

    const disks = s.disks || [];
    let diskStr = "";
    if (disks.length > 0){
      const worst = disks.reduce((a,b) => (a.percent > b.percent ? a : b), disks[0]);
      diskStr = `盘 ${Math.round(worst.percent)}%`;
    }
    const loadStr = (s.load && s.load.length) ? `负载 ${s.load[0].toFixed(1)}` : "";
    const netStr = s.net_rx_kbps != null ? `↓${fmtRate(s.net_rx_kbps)}` : "";
    const upStr = s.uptime_days != null ? `行 ${fmtUptime(s.uptime_days)}` : "";

    const topProcStr = procs.length ? `<span class="m-proc-inline">⚡ ${esc(procs[0].name)}${procs[0].cpu_percent ? ` <b>${Math.round(procs[0].cpu_percent)}%</b>` : ""}</span>` : "";

    return `<div class="sub-cloud-unit">
      <div class="sub-cloud-head">
        <div class="c-left">
          <span class="c-dot ${s_st}"></span>
          <span class="c-name" style="font-size:13.5px;">${esc(s.name)}</span>
          <span class="c-host" style="margin:0;font-size:10.5px;">${esc(s.label || "")}</span>
        </div>
        <span class="badge ${esc(s_st)}" style="font-size:10px;padding:1px 8px;">${levelText(s_st)}</span>
      </div>
      <div class="metrics-compact" style="margin:2px 0;">
        <div class="mbox">
          <div class="mhead">
            <span class="label">CPU</span>
            <span class="val ${tint(s.cpu_percent)}">${s.cpu_percent == null ? "—" : s.cpu_percent.toFixed(1) + "%"}</span>
          </div>
          ${bar(s.cpu_percent, "f-cpu", 80, 95)}
        </div>
        <div class="mbox">
          <div class="mhead">
            <span class="label">内存</span>
            <span class="val ${tint(mem.percent, 85, 95)}">${mem.percent == null ? "—" : mem.percent.toFixed(1) + "%"} <span class="msub">${fmtGB(mem.used_gb)}/${fmtGB(mem.total_gb)}</span></span>
          </div>
          ${bar(mem.percent, "f-mem", 85, 95)}
        </div>
      </div>
      ${procHtml}
      <div class="card-foot" style="padding-top:4px;margin-top:2px;">
        <span>${[topProcStr, diskStr, loadStr].filter(Boolean).join(" · ")}</span>
        <span>${[netStr, upStr].filter(Boolean).join(" · ")}</span>
      </div>
    </div>`;
  }).join('<div class="cloud-divider"></div>');

  return `<div class="card ${esc(st)}">
    <div class="chead" style="margin-bottom:2px;">
      <div class="c-left">
        <span class="c-name" style="font-size:14px;">☁️ 云服务器集群</span>
        <span class="c-group">轻量节点 · ${servers.length}台</span>
      </div>
      <span class="badge ${esc(st)}">${levelText(st)}</span>
    </div>
    <div class="cloud-cluster-body">
      ${subItems}
    </div>
  </div>`;
}

function render(d){
  const allServers = d.servers || [];

  // 1. 过滤离线：离线的就不要了！
  const onlineServers = allServers.filter(s => s.online);

  // 2. 区分通道与真实主机
  const tunnels = onlineServers.filter(s => s.is_tunnel);
  const realServers = onlineServers.filter(s => !s.is_tunnel);

  // 渲染通栏通道条
  const tunnelsBar = document.getElementById("tunnels-bar");
  const tunnelsList = document.getElementById("tunnels-list");
  if (tunnels.length > 0){
    tunnelsBar.style.display = "flex";
    tunnelsList.innerHTML = tunnels.map(t => {
      const isOk = t.status === "ok";
      return `<div class="tunnel-pill ${isOk ? 'ok' : 'crit'}">
        <span class="tdot"></span>
        <span><b>${esc(t.name)}</b></span>
        <span class="tmsg">${esc(t.tunnel_msg || "正常")}</span>
      </div>`;
    }).join("");
  } else {
    tunnelsBar.style.display = "none";
  }

  // 3. 提取轻量云服务器 (azure-lin & myserver)，将它们合并成一个卡片
  const cloudServers = realServers.filter(s =>
    s.group === "云服务器" || s.name === "azure-lin" || s.name === "myserver"
  );
  const otherServers = realServers.filter(s =>
    s.group !== "云服务器" && s.name !== "azure-lin" && s.name !== "myserver"
  );

  let cardsHtml = "";
  // 正常服务器
  cardsHtml += otherServers.map(renderCard).join("");
  // 合并云服务器卡片 (如果存在)
  if (cloudServers.length > 1) {
    cardsHtml += renderMergedCloudCard(cloudServers);
  } else if (cloudServers.length === 1) {
    cardsHtml += renderCard(cloudServers[0]);
  }

  // 渲染在线主机卡片 (紧凑一屏全览网格)
  document.getElementById("grid").innerHTML = cardsHtml ||
    `<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--dim)">无在线主机节点</div>`;

  // 顶部汇总
  const c = d.counts || {};
  document.getElementById("summary").innerHTML =
    ["ok","warn","crit","down"].map(k =>
      `<span class="chip ${k}"><i></i>${levelText(k)} <b>${c[k] || 0}</b></span>`).join("");

  const worst = (c.crit && "crit") || (c.warn && "warn") || "ok";
  document.getElementById("pulse").className = "pulse " + (worst === "ok" ? "" : worst);
  document.title = "服务器监控大屏";

  // 底部异常提醒
  const al = d.alerts || [];
  const alertEl = document.getElementById("alert-summary");
  if (al.length > 0){
    const latest = al[0];
    alertEl.innerHTML = `⚠️ 最近告警: <b>${esc(latest.name)}</b> ${esc(latest.msg)} (${timeStr(latest.t * 1000)})`;
    alertEl.style.color = "var(--warn)";
  } else {
    alertEl.innerHTML = `✅ 所有在线主机正常运行`;
    alertEl.style.color = "var(--dim)";
  }
}

/* ── 自动刷新 ── */
const REFRESH = 5;
let remain = REFRESH, paused = false, busy = false, lastTime = null;
const metaEl = document.getElementById("meta");

const qs = new URLSearchParams(location.search);
if (qs.get("token")){
  localStorage.setItem("mon_token", qs.get("token"));
  history.replaceState(null, "", location.pathname);
}
const TOKEN = localStorage.getItem("mon_token") || "";
const authHeaders = TOKEN ? {Authorization: "Bearer " + TOKEN} : {};

function updateMeta(){
  if (paused){
    metaEl.textContent = "已暂停刷新" + (lastTime ? ` (${timeStr(lastTime)})` : "");
    return;
  }
  metaEl.textContent = (lastTime ? `已更新 ${timeStr(lastTime)} · ` : "") + `${remain}s刷新`;
}

async function refresh(){
  if (busy) return;
  busy = true;
  try{
    const r = await fetch("api/status", {cache: "no-store", headers: authHeaders});
    if (r.status === 401){
      metaEl.textContent = "令牌未提供或失效，需在URL带 ?token=";
      busy = false; return;
    }
    render(await r.json());
    lastTime = Date.now();
  }catch(e){
    metaEl.textContent = "连接中…" + (lastTime ? ` (${timeStr(lastTime)})` : "");
  }
  remain = REFRESH;
  updateMeta();
  busy = false;
}

const btn = document.getElementById("btn-pause");
btn.onclick = () => {
  paused = !paused;
  btn.textContent = paused ? "继续" : "暂停";
  if (!paused) remain = REFRESH;
  updateMeta();
};

setInterval(() => {
  if (paused || document.hidden) return;
  remain--;
  if (remain <= 0) refresh(); else updateMeta();
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !paused) remain = 0;
});
window.addEventListener("online", () => { if (!paused) remain = 0; });

refresh();

if ("serviceWorker" in navigator && location.protocol !== "file:")
  navigator.serviceWorker.register("static/sw.js?v=4").catch(() => {});
</script>
