<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./static/manifest.webmanifest">
<link rel="icon" href="./static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./static/icons/icon-192.png">
<title>服务器监控大屏</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-card: rgba(18, 26, 45, 0.75);
    --bg-card-hover: rgba(24, 35, 60, 0.9);
    --line: rgba(70, 92, 130, 0.22);
    --line-light: rgba(90, 120, 170, 0.35);
    --line-border: #1a243b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --dim-sub: #475569;
    --ok: #10b981;
    --ok-glow: rgba(16, 185, 129, 0.35);
    --warn: #f59e0b;
    --warn-glow: rgba(245, 158, 11, 0.35);
    --crit: #ef4444;
    --crit-glow: rgba(239, 68, 68, 0.35);
    --down: #64748b;
    --c-cpu: #38bdf8;
    --c-mem: #a855f7;
    --c-disk: #14b8a6;
    --c-npu: #10b981;
    --c-hbm: #ec4899;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #263554; border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: rgba(56, 189, 248, 0.3); }

  body {
    margin: 0;
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 85% -10%, rgba(56, 189, 248, 0.08), transparent 60%),
                radial-gradient(1000px 500px at 0% 0%, rgba(16, 185, 129, 0.06), transparent 55%),
                var(--bg);
    min-height: 100vh;
    padding-bottom: 30px;
  }

  /* ── 顶部导航栏 ─────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(11, 15, 25, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 100;
  }
  .brand {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .brand svg { color: var(--c-cpu); }
  .pulse {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 var(--ok-glow);
    animation: pulse 2.4s infinite;
  }
  .pulse.warn { background: var(--warn); box-shadow: 0 0 0 0 var(--warn-glow); }
  .pulse.crit { background: var(--crit); box-shadow: 0 0 0 0 var(--crit-glow); }
  .pulse.down { background: var(--down); animation: none; box-shadow: none; }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 99px;
    border: 1px solid var(--line);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.03);
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--down); }
  .chip.ok i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .chip.warn i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .chip.crit i { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
  .chip.down i { background: var(--down); }
  .chip b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

  .meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-variant-numeric: tabular-nums;
  }
  .ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 99px;
    cursor: pointer;
    transition: 0.2s;
  }
  .ghost:hover { color: var(--text); border-color: var(--c-cpu); background: rgba(56, 189, 248, 0.08); }

  /* ── 主体内容 ─────────────────────────────── */
  main {
    max-width: 1560px;
    margin: 0 auto;
    padding: 24px 28px 12px;
  }

  /* ── 分组区块 ─────────────────────────────── */
  .section-group {
    margin-bottom: 34px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    font-weight: normal;
  }

  /* ── 服务器卡片网格 (Server Grid) ────────── */
  .server-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 18px;
    align-items: stretch;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }
  .card:hover {
    border-color: var(--line-light);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    background: var(--bg-card-hover);
  }

  /* 状态边条指示 */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--down);
    border-radius: 14px 0 0 14px;
  }
  .card.ok::before { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .card.warn::before { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  .card.crit::before { background: var(--crit); box-shadow: 0 0 12px var(--crit); }
  .card.down::before { background: var(--down); }

  /* 卡片头部 */
  .chead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .ct {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15.5px;
    font-weight: 700;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--down);
    flex: none;
  }
  .ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .crit .dot { background: var(--crit); box-shadow: 0 0 8px var(--crit); }

  .badge {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 99px;
    border: 1px solid var(--line);
    font-weight: 600;
  }
  .badge.ok { color: var(--ok); border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.08); }
  .badge.warn { color: var(--warn); border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.08); }
  .badge.crit { color: var(--crit); border-color: rgba(239, 68, 68, 0.35); background: rgba(239, 68, 68, 0.08); }
  .badge.down { color: var(--down); border-color: rgba(100, 116, 139, 0.3); background: rgba(100, 116, 139, 0.08); }

  .chost {
    color: var(--dim);
    font-size: 11.5px;
    font-family: Consolas, monospace;
    margin-bottom: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 核心指标行 */
  .metrics-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.03);
  }
  .metric-box { display: flex; flex-direction: column; gap: 4px; }
  .mrow { display: flex; justify-content: space-between; align-items: baseline; }
  .mlabel { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.8px; }
  .mval { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .msub { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mval.warn-t, .warn-t { color: var(--warn); }
  .mval.crit-t, .crit-t { color: var(--crit); }

  .bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; margin-top: 2px; }
  .fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .f-cpu { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  .f-mem { background: linear-gradient(90deg, #7c3aed, #c084fc); }
  .f-disk { background: linear-gradient(90deg, #0d9488, #2dd4bf); }
  .f-npu { background: linear-gradient(90deg, #059669, #34d399); }
  .f-hbm { background: linear-gradient(90deg, #db2777, #f472b6); }
  .f-warn { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .f-crit { background: linear-gradient(90deg, #dc2626, #f87171); }

  /* 迷你历史曲线 */
  .spark { width: 100%; height: 26px; margin-top: 4px; opacity: 0.85; display: block; }

  /* ── 加速卡芯片网格 (NPU / GPU Chips) ────────── */
  .accel-container {
    margin-top: 4px;
    margin-bottom: 12px;
  }
  .accel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .accel-title {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #e2e8f0;
  }
  .accel-summary-val {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* 芯片自适应网格: 1卡占1列，多卡并排两列，高度不膨胀 */
  .chips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .chip-card {
    background: rgba(15, 23, 42, 0.45);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chip-id {
    font-family: Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--c-npu);
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 16px;
  }
  .chip-meta {
    font-size: 10.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .chip-bar-row {
    display: grid;
    grid-template-columns: 26px 1fr 48px;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
  }
  .chip-bar-label { color: var(--dim); }
  .chip-bar-val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip-proc {
    font-size: 10.5px;
    color: var(--dim);
    font-family: Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 1px dashed rgba(255,255,255,0.06);
    padding-top: 4px;
    margin-top: 2px;
  }
  .chip-proc::before { content: "⚡ "; opacity: 0.7; color: var(--warn); }

  /* ── 系统进程 & 使用情况 (Usage Pills) ───────── */
  .usage-section {
    margin-top: 2px;
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.03);
    font-size: 11.5px;
  }
  .usage-title {
    color: var(--dim);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .proc-tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .proc-tag {
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 4px;
    padding: 2px 7px;
    color: #bae6fd;
    font-family: Consolas, monospace;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .proc-tag b { color: #38bdf8; font-weight: 600; }

  /* ── 磁盘紧凑行 ─────────────────────────────── */
  .disk-list {
    margin-top: 4px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .disk-item {
    display: grid;
    grid-template-columns: 80px 1fr 130px;
    gap: 8px;
    align-items: center;
    font-size: 11.5px;
  }
  .dmount { color: var(--muted); font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dnum { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── 卡片底部信息栏 ─────────────────────────── */
  .foot {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    color: var(--muted);
    font-size: 11.5px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .fl { color: var(--dim); margin-right: 4px; }

  /* ── 通道专用紧凑网格 (Tunnels Grid) ─────────── */
  .tunnel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .tunnel-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.2s;
  }
  .tunnel-card:hover {
    border-color: var(--line-light);
    background: var(--bg-card-hover);
  }
  .tunnel-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    flex: none;
  }
  .tunnel-card.crit .tunnel-dot, .tunnel-card.down .tunnel-dot {
    background: var(--crit);
    box-shadow: 0 0 8px var(--crit);
  }
  .tunnel-info {
    flex: 1;
    min-width: 0;
  }
  .tunnel-name {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tunnel-target {
    font-size: 11px;
    color: var(--dim);
    font-family: Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tunnel-status-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 99px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.25);
    color: var(--ok);
    font-weight: 600;
    white-space: nowrap;
  }
  .tunnel-card.crit .tunnel-status-tag, .tunnel-card.down .tunnel-status-tag {
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.25);
    color: var(--crit);
  }

  /* ── 离线占位卡 ─────────────────────────────── */
  .offline { padding: 24px 10px; text-align: center; color: var(--muted); }
  .off-icon { font-size: 26px; margin-bottom: 6px; }
  .off-t { font-size: 13px; font-weight: 600; color: #f59e0b; }
  .off-err {
    font-size: 11px;
    color: #d97706;
    margin: 8px auto 0;
    max-width: 95%;
    font-family: Consolas, monospace;
    word-break: break-all;
    background: rgba(245, 158, 11, 0.06);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 6px;
    padding: 6px 8px;
  }

  /* ── 告警栏 ─────────────────────────────────── */
  .alerts { max-width: 1560px; margin: 16px auto 0; padding: 0 28px; }
  .alerts h2 {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alerts h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .alerts ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-card);
    overflow: hidden;
  }
  .alerts li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 12.5px;
    border-top: 1px solid var(--line);
  }
  .alerts li:first-child { border-top: 0; }
  .adot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  li.ok .adot { background: var(--ok); }
  li.warn .adot { background: var(--warn); }
  li.crit .adot { background: var(--crit); }
  li.down .adot { background: var(--down); }
  .atime { color: var(--dim); font-family: Consolas, monospace; font-size: 11.5px; flex: none; }
  .alerts b { font-weight: 600; color: #fff; }
  .amsg { color: var(--muted); }

  /* ── 底部版权与下载 ─────────────────────────── */
  footer {
    color: var(--dim);
    font-size: 12px;
    text-align: center;
    padding: 24px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .dl-group {
    margin-top: 12px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dl-btn {
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    border-radius: 99px;
    padding: 6px 18px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }
  .dl-btn.apk { color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.05); }
  .dl-btn.apk:hover { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; }
  .dl-btn.exe { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.05); }
  .dl-btn.exe:hover { background: rgba(52, 211, 153, 0.15); border-color: #34d399; }

  /* ── 移动端极佳体验适配 (≤768px) ─────────────── */
  @media (max-width: 768px) {
    header { padding: 12px 16px; gap: 10px; }
    .brand { font-size: 15.5px; }
    .summary { width: 100%; order: 3; gap: 6px; }
    .chip { font-size: 11.5px; padding: 2.5px 10px; }
    .meta { margin-left: auto; font-size: 11.5px; }
    .ghost { padding: 6px 14px; }
    main { padding: 16px 16px 8px; }
    .server-grid { grid-template-columns: 1fr; gap: 14px; }
    .tunnel-grid { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 14px 15px; border-radius: 12px; }
    .card:hover { transform: none; }
    .chips-grid { grid-template-columns: 1fr; }
    .metrics-row { grid-template-columns: 1fr; gap: 10px; padding: 8px 10px; }
    .alerts { padding: 0 16px; }
    .alerts li { flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
    .amsg { width: 100%; padding-left: 19px; word-break: break-all; }
  }

  @supports (padding: env(safe-area-inset-top)) {
    header { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    body { padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="pulse" id="pulse"></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r="1.1" fill="currentColor" stroke="none"/></svg>
    服务器监控平台
  </div>
  <div class="summary" id="summary"></div>
  <div class="meta">
    <span id="meta">正在连接监控服务…</span>
    <button class="ghost" id="btn-pause">暂停自动刷新</button>
  </div>
</header>

<main id="main-content">
  <div class="empty">正在拉取监控指标…</div>
</main>

<section class="alerts">
  <h2>最近异常与告警记录</h2>
  <ul id="alerts"><li class="empty">暂无告警记录</li></ul>
</section>

<footer>
  <div>服务端定时经 SSH 采集实时指标 · 面板每 5 秒自动刷新</div>
  <div class="dl-group">
    <a class="dl-btn apk" href="./static/ServerMonitor.apk" download>📱 Android 悬浮窗 App (APK)</a>
    <a class="dl-btn exe" href="./download/ServerMonitor.exe?token=srvmon-9f3Kq7Wm2Rx8Vb4N" download>💻 Windows 桌面悬浮窗 (EXE)</a>
  </div>
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtGB = v => v == null ? "—" : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + " GB";
const fmtRate = k => k == null ? "—" : (k >= 1024 ? (k/1024).toFixed(2)+" MB/s" : k.toFixed(0)+" KB/s");
const levelText = s => ({ok:"正常", warn:"警告", crit:"严重", down:"离线"})[s] || s;
const timeStr = t => new Date(t).toLocaleTimeString("zh-CN",{hour12:false});
let uid = 0;

function bar(pct, cls, warn, crit){
  pct = Math.max(0, Math.min(100, pct ?? 0));
  let c = cls;
  if (warn != null && pct != null){
    if (pct >= crit) c = "f-crit"; else if (pct >= warn) c = "f-warn";
  }
  return `<div class="bar"><div class="fill ${c}" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function tint(v, warn=80, crit=95){
  return v == null ? "" : v >= crit ? "crit-t" : v >= warn ? "warn-t" : "";
}

function spark(points, color){
  if (!points || points.filter(v => v != null).length < 2)
    return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"></svg>`;
  const step = 100 / (points.length - 1);
  const poly = points.map((v,i) => v == null ? null :
    `${(i*step).toFixed(1)},${(24 - Math.max(0,Math.min(100,v))/100*22).toFixed(1)}`)
    .filter(Boolean).join(" ");
  const gid = "sg" + (++uid);
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".35"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#${gid})" points="${poly} 100,26 0,26"/>
    <polyline fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" points="${poly}"/>
  </svg>`;
}

function fmtUptime(d){
  if (d == null) return "—";
  if (d >= 1) return `${Math.floor(d)} 天 ${Math.round((d % 1) * 24)} 小时`;
  return `${Math.round(d * 24)} 小时`;
}

/* ── 加速卡多芯片网格渲染 ── */
function renderAccel(a){
  if (!a || !a.items || !a.items.length) return "";
  const isNpu = a.type === "NPU";
  const utils = a.items.map(x => x.util).filter(v => v != null);
  const avg = utils.length ? Math.round(utils.reduce((s,v)=>s+v,0) / utils.length) : null;
  const totU = a.items.reduce((s,x) => s + (x.mem_used_gb || 0), 0);
  const totT = a.items.reduce((s,x) => s + (x.mem_total_gb || 0), 0);
  const unit = isNpu ? "芯片" : "卡";

  const chipsHtml = a.items.map(it => {
    const memPct = it.mem_total_gb ? (it.mem_used_gb / it.mem_total_gb * 100) : 0;
    const tcls = it.temp_c == null ? "" : it.temp_c >= 85 ? "crit-t" : it.temp_c >= 75 ? "warn-t" : "";
    const metaParts = [];
    if (it.health && it.health !== "OK") metaParts.push(`<span class="crit-t">${esc(it.health)}</span>`);
    if (it.temp_c != null) metaParts.push(`<span class="${tcls}">${it.temp_c}°C</span>`);
    if (it.power_w != null) metaParts.push(`${it.power_w}W`);

    return `<div class="chip-card">
      <div class="chip-head">
        <span class="chip-id">#${esc(it.id)}</span>
        <span class="chip-meta">${metaParts.join(" · ")}</span>
      </div>
      <div class="chip-bar-row">
        <span class="chip-bar-label">算力</span>
        ${bar(it.util, isNpu ? "f-npu" : "f-cpu")}
        <span class="chip-bar-val">${it.util == null ? "—" : Math.round(it.util) + "%"}</span>
      </div>
      <div class="chip-bar-row">
        <span class="chip-bar-label">显存</span>
        ${bar(memPct, "f-hbm")}
        <span class="chip-bar-val">${fmtGB(it.mem_used_gb)}</span>
      </div>
      ${it.proc ? `<div class="chip-proc" title="${esc(it.proc)}">${esc(it.proc)}</div>` : ""}
    </div>`;
  }).join("");

  return `<div class="accel-container">
    <div class="accel-header">
      <span class="accel-title">⚡ ${isNpu ? "NPU 昇腾算力" : "GPU 加速卡"} (${a.items.length} ${unit})</span>
      <span class="accel-summary-val">${avg != null ? `平均算力 <b>${avg}%</b>` : ""}${totT ? ` · 显存已用 ${totU.toFixed(0)}/${totT.toFixed(0)}G` : ""}</span>
    </div>
    <div class="chips-grid">${chipsHtml}</div>
  </div>`;
}

/* ── 核心进程与使用情况 ── */
function renderUsage(s){
  if (s.is_tunnel) return "";
  const procs = s.processes || [];
  if (!procs.length) return "";

  const tags = procs.slice(0, 4).map(p => {
    const name = p.name || "?";
    const cpu = Math.round(p.cpu_percent || 0);
    return `<span class="proc-tag"><b>${esc(name)}</b><span>${cpu}%</span></span>`;
  }).join("");

  return `<div class="usage-section">
    <div class="usage-title">🔥 活跃进程 (Top CPU):</div>
    <div class="proc-tag-list">${tags}</div>
  </div>`;
}

/* ── 普通服务器卡片 ── */
function renderServerCard(s){
  const st = s.status || "down";
  const mem = s.mem || {};

  if (!s.online) {
    return `<div class="card ${esc(st)}">
      <div class="chead">
        <div class="ct"><span class="dot"></span><span>${esc(s.name)}</span></div>
        <span class="badge ${esc(st)}">${levelText(st)}</span>
      </div>
      <div class="chost">${esc(s.label || "")}</div>
      <div class="offline">
        <div class="off-icon">⚠️</div>
        <div class="off-t">连接异常 / 暂时离线</div>
        <div class="off-err">${esc(s.error || "未能建立 SSH 或探测连接")}</div>
      </div>
    </div>`;
  }

  const disks = s.disks || [];
  const disksHtml = disks.length ? `
    <div class="disk-list">
      ${disks.map(d => `
        <div class="disk-item">
          <span class="dmount" title="${esc(d.mount)}">${esc(d.mount)}</span>
          ${bar(d.percent, "f-disk", 80, 90)}
          <span class="dnum"><b class="${tint(d.percent, 80, 90)}">${Math.round(d.percent)}%</b> (${d.used_gb}/${d.total_gb}G)</span>
        </div>
      `).join("")}
    </div>` : "";

  return `<div class="card ${esc(st)}">
    <div class="chead">
      <div class="ct"><span class="dot"></span><span>${esc(s.name)}</span></div>
      <span class="badge ${esc(st)}">${levelText(st)}</span>
    </div>
    <div class="chost">${esc(s.label || "")}</div>

    <!-- 核心 CPU / 内存仪表 -->
    <div class="metrics-row">
      <div class="metric-box">
        <div class="mrow">
          <span class="mlabel">CPU 算力</span>
          <span class="mval ${tint(s.cpu_percent)}">${s.cpu_percent == null ? "—" : s.cpu_percent.toFixed(1) + "%"}</span>
        </div>
        ${bar(s.cpu_percent, "f-cpu", 80, 95)}
        ${spark((s.history || []).map(h => h.cpu), "#38bdf8")}
      </div>
      <div class="metric-box">
        <div class="mrow">
          <span class="mlabel">系统内存</span>
          <span class="mval ${tint(mem.percent, 85, 95)}">${mem.percent == null ? "—" : mem.percent.toFixed(1) + "%"}</span>
        </div>
        ${bar(mem.percent, "f-mem", 85, 95)}
        <div class="msub" style="margin-top:auto;padding-top:4px;">已用 ${fmtGB(mem.used_gb)} / ${fmtGB(mem.total_gb)}</div>
      </div>
    </div>

    <!-- 加速卡 -->
    ${renderAccel(s.accel)}

    <!-- 进程 -->
    ${renderUsage(s)}

    <!-- 磁盘 -->
    ${disksHtml}

    <!-- 底部负载信息 -->
    <div class="foot">
      <span><span class="fl">负载</span>${(s.load || []).map(v => v == null ? "—" : v.toFixed(2)).join(" / ")}${s.cores ? `<span class="dim"> (${s.cores}核)</span>` : ""}</span>
      <span><span class="fl">已运行</span>${fmtUptime(s.uptime_days)}</span>
      <span><span class="fl">网络</span>↓${fmtRate(s.net_rx_kbps)} · ↑${fmtRate(s.net_tx_kbps)}</span>
    </div>
  </div>`;
}

/* ── 通道专用紧凑小卡片 ── */
function renderTunnelCard(t){
  const st = t.status || "ok";
  const isOk = t.online && st === "ok";
  const msg = t.tunnel_msg || (isOk ? "HTTP 200 正常" : (t.error || "连接异常"));

  return `<div class="tunnel-card ${isOk ? 'ok' : 'crit'}">
    <div class="tunnel-dot"></div>
    <div class="tunnel-info">
      <div class="tunnel-name">${esc(t.name)}</div>
      <div class="tunnel-target">${esc(t.label || "")}</div>
    </div>
    <div class="tunnel-status-tag">${esc(msg)}</div>
  </div>`;
}

/* ── 分组总渲染 ── */
function render(d){
  const sv = d.servers || [];

  // 按 group 聚类
  const groups = [];
  for (const s of sv){
    const g = s.group || "其他服务器";
    let bucket = groups.find(x => x.name === g);
    if (!bucket){ bucket = {name: g, items: []}; groups.push(bucket); }
    bucket.items.push(s);
  }

  let html = "";
  for (const g of groups){
    const isTunnelGroup = g.items.every(x => x.is_tunnel);
    const onlineCount = g.items.filter(x => x.online).length;
    const totalCount = g.items.length;

    html += `<div class="section-group">
      <div class="section-header">
        <div class="section-title">
          ${isTunnelGroup ? "🌐" : (g.name.includes("云脑") ? "🧠" : (g.name.includes("本机") ? "🖥️" : "☁️"))}
          <span>${esc(g.name)}</span>
        </div>
        <span class="section-tag">${onlineCount}/${totalCount} 在线</span>
      </div>`;

    if (isTunnelGroup) {
      html += `<div class="tunnel-grid">${g.items.map(renderTunnelCard).join("")}</div>`;
    } else {
      html += `<div class="server-grid">${g.items.map(renderServerCard).join("")}</div>`;
    }

    html += `</div>`;
  }

  document.getElementById("main-content").innerHTML =
    html || `<div class="empty">配置文件中未找到启用的服务器节点</div>`;

  // 顶部汇总
  const c = d.counts || {};
  document.getElementById("summary").innerHTML =
    ["ok","warn","crit","down"].map(k =>
      `<span class="chip ${k}"><i></i>${levelText(k)} <b>${c[k] || 0}</b></span>`).join("");

  const worst = (c.crit && "crit") || (c.warn && "warn") || (c.down && "down") || "ok";
  document.getElementById("pulse").className = "pulse " + (worst === "ok" ? "" : worst);
  document.title = ((c.warn || c.crit) ? `(${c.warn + c.crit} 项告警) ` : "") + "服务器监控大屏";

  // 告警列表
  const al = d.alerts || [];
  document.getElementById("alerts").innerHTML = al.length ? al.map(a =>
    `<li class="${esc(a.level)}">
       <span class="adot"></span>
       <span class="atime">${timeStr(a.t * 1000)}</span>
       <b>${esc(a.name)}</b>
       <span class="amsg">${esc(a.msg)}</span>
     </li>`).join("")
    : `<li class="empty">全部系统正常，暂无告警事件</li>`;
}

/* ── 自动刷新 + 令牌鉴权 + 状态同步 ── */
const REFRESH = 5;
let remain = REFRESH, paused = false, busy = false, lastTime = null;
const metaEl = document.getElementById("meta");

// 令牌处理
const qs = new URLSearchParams(location.search);
if (qs.get("token")){
  localStorage.setItem("mon_token", qs.get("token"));
  history.replaceState(null, "", location.pathname);
}
const TOKEN = localStorage.getItem("mon_token") || "";
const authHeaders = TOKEN ? {Authorization: "Bearer " + TOKEN} : {};

function updateMeta(){
  if (paused){
    metaEl.textContent = "已暂停自动刷新" + (lastTime ? ` · 数据于 ${timeStr(lastTime)}` : "");
    return;
  }
  metaEl.textContent = (lastTime ? `更新于 ${timeStr(lastTime)} · ` : "") + `${remain}s 后刷新`;
}

async function refresh(){
  if (busy) return;
  busy = true;
  try{
    const r = await fetch("api/status", {cache: "no-store", headers: authHeaders});
    if (r.status === 401){
      metaEl.textContent = "访问令牌已失效或缺少凭据，请在 URL 补充 ?token=";
      busy = false; return;
    }
    render(await r.json());
    lastTime = Date.now();
  }catch(e){
    metaEl.textContent = "连接后端超时" + (lastTime ? ` · 最后更新 ${timeStr(lastTime)}` : "");
  }
  remain = REFRESH;
  updateMeta();
  busy = false;
}

const btn = document.getElementById("btn-pause");
btn.onclick = () => {
  paused = !paused;
  btn.textContent = paused ? "恢复实时刷新" : "暂停自动刷新";
  if (!paused) remain = REFRESH;
  updateMeta();
};

setInterval(() => {
  if (paused) return;
  if (document.hidden) return;
  remain--;
  if (remain <= 0) refresh(); else updateMeta();
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !paused){ remain = 0; }
});
window.addEventListener("online", () => { if (!paused) remain = 0; });

refresh();

if ("serviceWorker" in navigator && location.protocol !== "file:")
  navigator.serviceWorker.register("static/sw.js?v=3").catch(() => {});
</script>
