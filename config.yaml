  #   host: 1.2.3.4
  #   port: 22
  #   user: root
  #   key_file: C:/Users/linxb/.ssh/id_rsa
  # - name: my-server2
  #   host: 1.2.3.5
  #   user: root
  #   password: "你的密码"
